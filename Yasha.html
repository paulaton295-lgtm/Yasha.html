<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Georgia", serif;
      background: linear-gradient(135deg, #ffe0e9, #f8c8dc, #e8d5ff);
      color: #773c59;
      overflow-x: hidden;
    }

    .container {
      width: 90%;
      max-width: 550px;
      padding: 35px 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(120, 55, 90, 0.18);
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3rem);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1rem;
      margin-bottom: 35px;
    }

    /* Birthday cake */

    .cake {
      position: relative;
      width: 220px;
      height: 190px;
      margin: 0 auto 25px;
    }

    .plate {
      position: absolute;
      width: 230px;
      height: 15px;
      bottom: 5px;
      left: -5px;
      background: #d8a0bb;
      border-radius: 50%;
    }

    .cake-bottom {
      position: absolute;
      bottom: 20px;
      left: 15px;
      width: 190px;
      height: 65px;
      background: #e99bb9;
      border-radius: 10px 10px 18px 18px;
      box-shadow: inset 0 -9px #d97da3;
    }

    .cake-top {
      position: absolute;
      bottom: 75px;
      left: 15px;
      width: 190px;
      height: 35px;
      background: #fff0f5;
      border-radius: 50% 50% 10px 10px;
    }

    .icing {
      position: absolute;
      bottom: 65px;
      left: 15px;
      width: 190px;
      height: 25px;
      background: #fff0f5;
      border-radius: 0 0 12px 12px;
    }

    .icing::before,
    .icing::after {
      content: "";
      position: absolute;
      background: #fff0f5;
      width: 18px;
      height: 25px;
      border-radius: 0 0 10px 10px;
      top: 0;
    }

    .icing::before {
      left: 35px;
      height: 35px;
    }

    .icing::after {
      right: 40px;
      height: 30px;
    }

    .candle {
      position: absolute;
      bottom: 105px;
      left: 99px;
      width: 22px;
      height: 62px;
      background: repeating-linear-gradient(
        45deg,
        #fff 0px,
        #fff 7px,
        #ed8db0 7px,
        #ed8db0 13px
      );
      border-radius: 4px 4px 2px 2px;
      cursor: pointer;
      z-index: 2;
    }

    .wick {
      position: absolute;
      width: 3px;
      height: 10px;
      background: #60414b;
      top: -9px;
      left: 9px;
    }

    .flame {
      position: absolute;
      width: 22px;
      height: 32px;
      top: -38px;
      left: 0;
      background: radial-gradient(
        ellipse at 50% 70%,
        #fff7ad 0%,
        #ffbd45 40%,
        #ff753d 75%
      );
      border-radius: 50% 50% 45% 45%;
      transform: rotate(3deg);
      box-shadow: 0 0 22px #ffb347;
      animation: flicker 0.6s infinite alternate;
      transform-origin: bottom center;
    }

    .flame.off {
      display: none;
    }

    @keyframes flicker {
      from {
        transform: rotate(-5deg) scale(0.95);
      }
      to {
        transform: rotate(5deg) scale(1.08);
      }
    }

    /* Birthday message */

    #birthdayMessage {
      display: none;
      animation: appear 1s ease;
    }

    #birthdayMessage h2 {
      font-size: 2rem;
      color: #d14f86;
      margin: 12px 0;
    }

    #birthdayMessage p {
      line-height: 1.7;
    }

    /* Clickable letter */

    .letter-section {
      display: none;
      margin-top: 25px;
      animation: appear 1s ease;
    }

    .letter {
      width: 130px;
      height: 95px;
      position: relative;
      margin: 20px auto 12px;
      background: #fff;
      border: 2px solid #e8a1bf;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 6px 15px rgba(120, 55, 90, 0.15);
    }

    .letter:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 12px 20px rgba(120, 55, 90, 0.22);
    }

    .letter::before {
      content: "";
      position: absolute;
      top: -2px;
      left: 0;
      width: 0;
      height: 0;
      border-left: 63px solid transparent;
      border-right: 63px solid transparent;
      border-top: 48px solid #f7c4d8;
    }

    .letter-icon {
      position: absolute;
      top: 42px;
      left: 0;
      width: 100%;
      font-size: 24px;
      z-index: 2;
    }

    .letter-label {
      font-weight: bold;
      color: #a34370;
    }

    .hint {
      font-size: 0.9rem;
      color: #98657e;
    }

    #instruction {
      font-size: 0.95rem;
      color: #98657e;
      margin-top: 10px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp 5s linear forwards;
      z-index: -1;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 400px) {
      .container {
        padding: 28px 12px;
      }

      .cake {
        transform: scale(0.9);
        margin-bottom: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <h1> A Little Surprise sa akong barkada</h1>


    <div class="cake" aria-label="Birthday cake">
      <div class="plate"></div>
      <div class="cake-bottom"></div>
      <div class="cake-top"></div>
      <div class="icing"></div>

      <div
        class="candle"
        id="candle"
        role="button"
        tabindex="0"
        aria-label="Blow out the birthday candle"
      >
        <div class="wick"></div>
        <div class="flame" id="flame"></div>
      </div>
    </div>

    <p id="instruction">
      ✨ Pislita ang kandila and make a wish ✨
    </p>

    <section id="birthdayMessage">
      <h2>Happy Birthday Yasha! </h2>
      
    </section>

    <section class="letter-section" id="letterSection">
      <p>There's something else I want you to see...</p>

      <div
        class="letter"
        id="letter"
        role="link"
        tabindex="0"
        aria-label="Open your birthday letter"
      >
        <span class="letter-icon">💌</span>
      </div>

      <div class="letter-label">A letter for you</div>
      <p class="hint">Please press the letter and see the magic ♡</p>
    </section>
  </main>

  <script>
    // CHANGE THIS to the website you want the letter to open.
    const letterWebsite = "LettertoYasha.html";

    const candle = document.getElementById("candle");
    const flame = document.getElementById("flame");
    const instruction = document.getElementById("instruction");
    const birthdayMessage = document.getElementById("birthdayMessage");
    const letterSection = document.getElementById("letterSection");
    const letter = document.getElementById("letter");

    let candleBlownOut = false;

    function blowOutCandle() {
      if (candleBlownOut) return;

      candleBlownOut = true;

      // Turn off the candle flame.
      flame.classList.add("off");

      // Show the birthday message and letter.
      instruction.textContent = "Your wish is on its way! ✨";
      birthdayMessage.style.display = "block";
      letterSection.style.display = "block";

      // Create floating hearts.
      for (let i = 0; i < 18; i++) {
        setTimeout(createHeart, i * 180);
      }
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["💗", "💕", "💖", "🌸"][
        Math.floor(Math.random() * 4)
      ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 3 + Math.random() * 3 + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6500);
    }

    function openLetter() {
      if (!candleBlownOut) return;

      // Open the selected website in a new tab.
      window.open(letterWebsite, "_blank", "noopener,noreferrer");
    }

    candle.addEventListener("click", blowOutCandle);

    candle.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        blowOutCandle();
      }
    });

    letter.addEventListener("click", openLetter);

    letter.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openLetter();
      }
    });
  </script>

</body>
</html>
